name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARCHIVE_BIND_ADDRESS: 127.0.0.1
      ARCHIVE_HTTP_PORT: "18088"
      ARCHIVE_DATA_PATH: /tmp/overdrive-archive-ci-data
      ARCHIVE_HOST_PATH: /tmp/overdrive-archive-ci-files
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile and test
        run: make check
      - name: Check browser JavaScript
        run: node --check app/static/app.js
      - name: Generate smoke-test credential
        run: echo "ARCHIVE_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          secret_file="$(mktemp)"
          openssl rand -base64 32 > "$secret_file"
          ARCHIVE_ADMIN_PASSWORD_SECRET_FILE="$secret_file" \
            docker compose -f compose.yaml -f compose.secrets.yaml config --quiet
          rm -f "$secret_file"
      - name: Build container
        run: docker build -t overdrive-archive:local .
      - name: Start Compose stack
        run: docker compose up -d --wait
      - name: Verify health endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:18088/healthz
      - name: Verify login and authenticated API
        run: |
          cookie_jar="$(mktemp)"
          trap 'rm -f "$cookie_jar"' EXIT
          curl --fail --silent --show-error \
            --cookie-jar "$cookie_jar" \
            --header "Content-Type: application/json" \
            --data "{\"username\":\"admin\",\"password\":\"${ARCHIVE_ADMIN_PASSWORD}\"}" \
            http://127.0.0.1:18088/api/login > /dev/null
          curl --fail --silent --show-error \
            --cookie "$cookie_jar" \
            http://127.0.0.1:18088/api/overview > /dev/null
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --redact --verbose
