# Optional Docker Compose override for file-backed administrator credentials.
#
# Usage:
#   mkdir -p secrets
#   openssl rand -base64 32 > secrets/archive_admin_password
#   chmod 700 secrets
#   chmod 600 secrets/archive_admin_password
#   docker compose -f compose.yaml -f compose.secrets.yaml up -d --build
#
# The secrets/ directory is excluded from Git and the Docker build context.

services:
  archive:
    environment:
      ARCHIVE_ADMIN_PASSWORD: ""
      ARCHIVE_ADMIN_PASSWORD_FILE: /run/secrets/archive_admin_password
    secrets:
      - archive_admin_password

secrets:
  archive_admin_password:
    file: ${ARCHIVE_ADMIN_PASSWORD_SECRET_FILE:-./secrets/archive_admin_password}
